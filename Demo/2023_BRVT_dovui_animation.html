<div>
<h2 class="sr-only">Minh họa từng bước thuật toán quy hoạch động với cửa sổ K phần tử cho bài GAME1, với ví dụ N=5, K=3, mảng năng lượng 10,25,35,40,20</h2>

<div style="display:flex; gap:8px; align-items:center; margin-bottom:1rem; flex-wrap:wrap;">
  <button id="btnPrev">⟵ Lùi</button>
  <button id="btnNext">Tiến ⟶</button>
  <button id="btnPlay">▶ Tự chạy</button>
  <button id="btnReset">↺ Bắt đầu lại</button>
  <span style="margin-left:auto; font-size:13px; color:var(--text-secondary);" id="stepCounter">Bước 0 / 0</span>
</div>

<p style="font-size:12px; color:var(--text-muted); margin:0 0 4px;">Mảng h[] (năng lượng mỗi ô), K = 3 (nhảy tối đa 3 ô)</p>
<div id="gridH" style="display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; margin-bottom:1rem;"></div>

<p style="font-size:12px; color:var(--text-muted); margin:0 0 4px;">Mảng f[] (chi phí nhỏ nhất để đến ô i)</p>
<div id="gridF" style="display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; margin-bottom:1rem;"></div>

<div style="background:var(--surface-1); border-radius:var(--radius); padding:12px 16px; min-height:56px; display:flex; align-items:center;">
  <p id="explain" style="margin:0; font-size:15px; line-height:1.6;">Nhấn "Tiến" để bắt đầu.</p>
</div>
</div>

<script>
(function(){
  var h = [0, 10, 25, 35, 40, 20];
  var n = 5;
  var k = 3;
  var INF = "∞";

  var f = [0, 0, INF, INF, INF, INF];

  var steps = [];
  steps.push({i:null, j:null, winLo:null, winHi:null, f: f.slice(), msg:
    "Khởi tạo f[1] = 0 (đứng ở ô 1 không tốn chi phí gì). Các ô khác f[i] tạm coi là vô cực (chưa tính được)."});

  for (var i = 2; i <= n; i++) {
    f[i] = Infinity;
    var lo = Math.max(1, i - k);
    var hi = i - 1;
    steps.push({i:i, j:null, winLo:lo, winHi:hi, f: f.slice(), msg:
      "Xét ô i = " + i + " (h[" + i + "] = " + h[i] + "). Vì mỗi lần chỉ nhảy tối đa K=" + k + " ô, nên ô i chỉ có thể đến từ các ô j trong cửa sổ [" + lo + ", " + hi + "] (tô xám) — không cần xét toàn bộ các ô trước đó."});

    for (var j = lo; j <= hi; j++) {
      var candidate = f[j] + Math.abs(h[i] - h[j]);
      var currentDisplay = (f[i] === Infinity) ? INF : f[i];
      if (candidate <= f[i]) {
        f[i] = candidate;
        steps.push({i:i, j:j, winLo:lo, winHi:hi, f: f.slice(), msg:
          "So sánh j = " + j + " (f[" + j + "]=" + (f[j]===Infinity?INF:f[j]) + ", h[" + j + "]=" + h[j] + "): f[" + j + "] + |h[" + i + "]-h[" + j + "]| = " + (f[j]===Infinity?INF:f[j]) + " + |" + h[i] + "-" + h[j] + "| = " + candidate + " ≤ f[" + i + "] hiện tại (" + currentDisplay + ") → cập nhật f[" + i + "] = " + candidate + "."});
      } else {
        steps.push({i:i, j:j, winLo:lo, winHi:hi, f: f.slice(), msg:
          "So sánh j = " + j + " (f[" + j + "]=" + f[j] + ", h[" + j + "]=" + h[j] + "): f[" + j + "] + |h[" + i + "]-h[" + j + "]| = " + f[j] + " + |" + h[i] + "-" + h[j] + "| = " + candidate + " > f[" + i + "] hiện tại (" + currentDisplay + ") → không cập nhật."});
      }
    }
  }

  steps.push({i:null, j:null, winLo:null, winHi:null, f: f.slice(), answer:true, msg:
    "Duyệt hết mảng. Đáp án là f[" + n + "] = " + f[n] + " — chi phí nhỏ nhất để nhảy từ ô 1 đến ô " + n + "."});

  var cur = 0;
  var timer = null;

  var gridH = document.getElementById("gridH");
  var gridF = document.getElementById("gridF");
  var explain = document.getElementById("explain");
  var stepCounter = document.getElementById("stepCounter");

  function renderH(s) {
    gridH.innerHTML = "";
    for (var idx = 1; idx <= n; idx++) {
      var cls = "";
      if (s.i === idx) { cls = "c-blue t"; }
      else if (s.j === idx) { cls = "c-amber t"; }
      else if (s.winLo !== null && idx >= s.winLo && idx <= s.winHi) { cls = "c-gray t"; }

      var wrap = document.createElement("div");
      wrap.className = cls;
      wrap.style.border = "0.5px solid var(--border)";
      wrap.style.borderRadius = "8px";
      wrap.style.padding = "8px 4px";
      wrap.style.textAlign = "center";
      if (cls === "") { wrap.style.background = "var(--surface-1)"; }

      var lbl = document.createElement("div");
      lbl.textContent = "h[" + idx + "]";
      lbl.style.fontSize = "11px";
      if (cls === "") { lbl.style.color = "var(--text-muted)"; } else { lbl.className = "ts"; }

      var val = document.createElement("div");
      val.textContent = h[idx];
      val.style.fontSize = "16px";
      val.style.fontWeight = "500";
      if (cls === "") { val.style.color = "var(--text-primary)"; }

      wrap.appendChild(lbl);
      wrap.appendChild(val);
      gridH.appendChild(wrap);
    }
  }

  function renderF(s) {
    gridF.innerHTML = "";
    for (var idx = 1; idx <= n; idx++) {
      var cls = "";
      if (s.answer && idx === n) { cls = "c-teal t"; }
      else if (s.i === idx) { cls = "c-blue t"; }
      else if (s.j === idx) { cls = "c-amber t"; }

      var wrap = document.createElement("div");
      wrap.className = cls;
      wrap.style.border = "0.5px solid var(--border)";
      wrap.style.borderRadius = "8px";
      wrap.style.padding = "8px 4px";
      wrap.style.textAlign = "center";
      if (cls === "") { wrap.style.background = "var(--surface-1)"; }

      var lbl = document.createElement("div");
      lbl.textContent = "f[" + idx + "]";
      lbl.style.fontSize = "11px";
      if (cls === "") { lbl.style.color = "var(--text-muted)"; } else { lbl.className = "ts"; }

      var val = document.createElement("div");
      var valDisplay = s.f[idx];
      if (valDisplay === Infinity) { valDisplay = "∞"; }
      val.textContent = valDisplay;
      val.style.fontSize = "16px";
      val.style.fontWeight = "500";
      if (cls === "") { val.style.color = "var(--text-primary)"; }

      wrap.appendChild(lbl);
      wrap.appendChild(val);
      gridF.appendChild(wrap);
    }
  }

  function render() {
    var s = steps[cur];
    renderH(s);
    renderF(s);
    explain.textContent = s.msg;
    stepCounter.textContent = "Bước " + cur + " / " + (steps.length - 1);
    document.getElementById("btnPrev").disabled = (cur === 0);
    document.getElementById("btnNext").disabled = (cur === steps.length - 1);
  }

  document.getElementById("btnNext").onclick = function(){
    if (cur < steps.length - 1) { cur++; render(); }
  };
  document.getElementById("btnPrev").onclick = function(){
    if (cur > 0) { cur--; render(); }
  };
  document.getElementById("btnReset").onclick = function(){
    cur = 0; render();
    if (timer) { clearInterval(timer); timer = null; document.getElementById("btnPlay").textContent = "▶ Tự chạy"; }
  };
  document.getElementById("btnPlay").onclick = function(){
    var btn = document.getElementById("btnPlay");
    if (timer) {
      clearInterval(timer); timer = null; btn.textContent = "▶ Tự chạy";
    } else {
      btn.textContent = "⏸ Dừng";
      timer = setInterval(function(){
        if (cur < steps.length - 1) { cur++; render(); }
        else { clearInterval(timer); timer = null; btn.textContent = "▶ Tự chạy"; }
      }, 1200);
    }
  };

  render();
})();
</script>
