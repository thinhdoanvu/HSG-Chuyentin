<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đặt ghế đá dưới các cây</title>
<style>
:root{--bg:#0f1420;--card:#171e2e;--line:#2a3550;--tx:#e6ebf5;--mut:#8e9ab5;--ac:#5eead4;--warn:#fbbf24;--ok:#4ade80;--bad:#f87171;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding:16px;max-width:980px;margin:auto}
h1{font-family:Georgia,serif;font-size:22px;margin:4px 0}
p.sub{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
button{background:#22304d;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:14px}
button:hover{border-color:var(--ac)} button.on{background:var(--ac);color:#06201c;font-weight:600}
input[type=text]{background:#0b101b;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:7px;width:90px;font-family:ui-monospace,monospace}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.trees{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.t{width:58px;border:2px solid var(--line);border-radius:10px;text-align:center;padding:6px 2px;opacity:.4}
.t .ic{font-size:26px;line-height:1.1}
.t .no{font-size:11px;color:var(--mut)}
.t .bn{height:20px;font-size:13px;color:var(--ok);font-weight:600}
.t.seen{opacity:1}
.t.cur{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn);opacity:1}
.t.has{background:#12301f;border-color:var(--ok);opacity:1}
.vars{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.v{background:#0b101b;border-radius:8px;padding:8px 14px;text-align:center;font-size:13px;color:var(--mut)}
.v b{display:block;font-size:22px;font-family:ui-monospace,monospace;color:var(--tx)}
.msg{min-height:44px;line-height:1.5;margin-top:8px}
.box{background:#0b101b;border-radius:8px;padding:10px;margin-top:8px;line-height:1.6}
pre{background:#0b101b;border-radius:8px;padding:12px;overflow:auto;font-size:13px;line-height:1.5;margin:8px 0 0}
.ok{color:var(--ok)} .warn{color:var(--warn)} .hl{color:var(--ac)}
</style>
</head>
<body>
<h1>Đặt ghế đá xen kẽ dưới n cây</h1>
<p class="sub">Đặt ghế ở cây 1, bỏ cây 2, đặt ở cây 3, … (không có hai cây liền nhau cùng có ghế). Tính tổng chi phí khi đặt được nhiều ghế nhất.</p>

<div class="card">
  <div class="row" id="presets"></div>
  <div class="row">
    n = <input type="text" id="inN" maxlength="2"> cây &nbsp; giá mỗi ghế x = <input type="text" id="inX" maxlength="6">
    <button id="load">Áp dụng</button>
  </div>
  <div style="color:var(--mut);font-size:13px">Để dễ nhìn, demo cho n từ 1 đến 30.</div>
</div>

<div class="card">
  <div class="trees" id="trees"></div>
  <div class="vars">
    <div class="v">cây đang xét<b id="vi">-</b></div>
    <div class="v">số ghế đã đặt<b id="vg">0</b></div>
    <div class="v">tổng chi phí<b id="vt" class="ok">0</b></div>
  </div>
  <div class="msg" id="msg"></div>
  <div class="box" id="formula"></div>
  <div class="row" style="margin-top:12px">
    <button id="prev">◀ Lùi</button>
    <button id="next">Bước tiếp ▶</button>
    <button id="auto">▶ Tự chạy</button>
    <button id="reset">↺ Đặt lại</button>
  </div>
</div>

<div class="card">
  <div class="row"><button class="on" id="tcpp">C++</button><button id="tpy">Python</button></div>
  <pre id="code"></pre>
</div>

<script>
var PRESETS=[{n:"n=5 (lẻ)",a:5,b:10},{n:"n=6 (chẵn)",a:6,b:10},{n:"n=1",a:1,b:7},{n:"n=11",a:11,b:3}];
var CPP=
"#include <iostream>\nusing namespace std;\n\nint main() {\n    long long n, x;\n    cin >> n >> x;     // n cây, mỗi ghế giá x\n\n"+
"    long long soGhe;\n    if (n % 2 == 0) {\n        soGhe = n / 2;         // chẵn: cây 1,3,5,...,n-1\n    } else {\n        soGhe = n / 2 + 1;     // lẻ: cây 1,3,5,...,n\n    }\n\n"+
"    long long tong = soGhe * x;\n    cout << tong << endl;\n    return 0;\n}\n";
var PY=
"n, x = map(int, input().split())    # n cây, mỗi ghế giá x\n\n"+
"if n % 2 == 0:\n    so_ghe = n // 2          # chẵn: cây 1,3,5,...,n-1\nelse:\n    so_ghe = n // 2 + 1      # lẻ: cây 1,3,5,...,n\n\n"+
"tong = so_ghe * x\nprint(tong)\n";

var n=5,x=10,steps=[],pos=0,timer=null;

function build(){
  steps=[];
  var g=0;
  steps.push({i:0,g:0,msg:"Có <b>"+n+" cây</b>, mỗi ghế giá <b>"+x+"</b>. Đi từ cây 1: có ghế thì cây kế tiếp bỏ trống."});
  for(var i=1;i<=n;i++){
    var has=(i%2===1),m;
    if(has){g++;m="Cây <b>"+i+"</b> (lẻ) ⇒ <span class='ok'>đặt ghế</span>. Số ghế = "+g+", chi phí = "+g+" × "+x+" = <b>"+(g*x)+"</b>.";}
    else m="Cây <b>"+i+"</b> (chẵn) ⇒ <span class='warn'>bỏ trống</span> (cây "+(i-1)+" liền kề đã có ghế).";
    steps.push({i:i,g:g,msg:m});
  }
  steps.push({i:n+1,g:g,msg:"Xong. <b class='ok'>Tổng chi phí = "+g+" × "+x+" = "+(g*x)+"</b>."});
  pos=0;render();
}

function render(){
  var st=steps[pos],h="";
  for(var k=1;k<=n;k++){
    var c="t",b="";
    if(k<=st.i&&st.i<=n||st.i>n)c+=" seen";
    if(k%2===1&&k<=Math.min(st.i,n)){c+=" has";b="🪑 ghế";}
    if(k===st.i)c+=" cur";
    h+="<div class='"+c+"'><div class='ic'>🌳</div><div class='no'>cây "+k+"</div><div class='bn'>"+b+"</div></div>";
  }
  document.getElementById("trees").innerHTML=h;
  document.getElementById("vi").textContent=(st.i>=1&&st.i<=n)?st.i:"-";
  document.getElementById("vg").textContent=st.g;
  document.getElementById("vt").textContent=st.g*x;
  document.getElementById("msg").innerHTML=st.msg;
  var f;
  if(n%2===0)f="n = "+n+" là <b>chẵn</b> ⇒ số ghế = n / 2 = <span class='hl'>"+(n/2)+"</span> ⇒ chi phí = "+(n/2)+" × "+x+" = <b>"+(n/2*x)+"</b>";
  else f="n = "+n+" là <b>lẻ</b> ⇒ số ghế = n / 2 + 1 = <span class='hl'>"+((n-1)/2+1)+"</span> (chia nguyên rồi cộng 1) ⇒ chi phí = "+((n-1)/2+1)+" × "+x+" = <b>"+(((n-1)/2+1)*x)+"</b>";
  document.getElementById("formula").innerHTML="<b>Công thức:</b> "+f;
}

function stop(){if(timer){clearInterval(timer);timer=null;document.getElementById("auto").textContent="▶ Tự chạy";}}
function next(){if(pos<steps.length-1){pos++;render();}else stop();}
function load(){
  stop();
  var a=parseInt(document.getElementById("inN").value,10);
  var b=parseInt(document.getElementById("inX").value,10);
  if(isNaN(a)||a<1)a=5; if(a>30)a=30;
  if(isNaN(b)||b<1)b=10;
  n=a;x=b;
  document.getElementById("inN").value=n;
  document.getElementById("inX").value=x;
  build();
}

(function init(){
  var box=document.getElementById("presets");
  PRESETS.forEach(function(p){
    var bt=document.createElement("button");bt.textContent=p.n;
    bt.onclick=function(){document.getElementById("inN").value=p.a;document.getElementById("inX").value=p.b;load();};
    box.appendChild(bt);
  });
  document.getElementById("load").onclick=load;
  document.getElementById("next").onclick=function(){stop();next();};
  document.getElementById("prev").onclick=function(){stop();if(pos>0){pos--;render();}};
  document.getElementById("reset").onclick=function(){stop();pos=0;render();};
  document.getElementById("auto").onclick=function(){
    if(timer){stop();return;}
    if(pos>=steps.length-1)pos=0;
    document.getElementById("auto").textContent="⏸ Dừng";
    timer=setInterval(next,800);
  };
  function tab(w){
    document.getElementById("code").textContent=w==="cpp"?CPP:PY;
    document.getElementById("tcpp").className=w==="cpp"?"on":"";
    document.getElementById("tpy").className=w==="py"?"on":"";
  }
  document.getElementById("tcpp").onclick=function(){tab("cpp");};
  document.getElementById("tpy").onclick=function(){tab("py");};
  tab("cpp");
  document.getElementById("inN").value=5;
  document.getElementById("inX").value=10;
  load();
})();
</script>
</body>
</html>
