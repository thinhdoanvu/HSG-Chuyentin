<div>
<h2 class="sr-only">Minh họa từng bước thuật toán sàng tổng ước với các số từ 1 đến 21</h2>

<div style="display:flex; gap:8px; align-items:center; margin-bottom:1rem; flex-wrap:wrap;">
  <button id="btnPrev">⟵ Lùi</button>
  <button id="btnNext">Tiến ⟶</button>
  <button id="btnPlay">▶ Tự chạy</button>
  <button id="btnReset">↺ Bắt đầu lại</button>
  <span style="margin-left:auto; font-size:13px; color:var(--text-secondary);" id="stepCounter">Bước 0 / 0</span>
</div>

<div id="grid" style="display:grid; grid-template-columns:repeat(7, 1fr); gap:6px; margin-bottom:1rem;"></div>

<div style="background:var(--surface-1); border-radius:var(--radius); padding:12px 16px; min-height:56px; display:flex; align-items:center;">
  <p id="explain" style="margin:0; font-size:15px; line-height:1.6;">Nhấn "Tiến" để bắt đầu.</p>
</div>
</div>

<script>
(function(){
  var R = 21;
  var boxes = [];
  for (var i = 0; i <= R; i++) { boxes.push(1); }
  boxes[0] = 0;

  var steps = [];
  steps.push({type:"init", boxes: boxes.slice(), msg: "Khởi tạo: mọi hộp đều được để sẵn 1 đồng, vì số nào cũng có ước là 1."});

  var b = boxes.slice();
  var limit = Math.floor(Math.sqrt(R));
  for (var i2 = 2; i2 <= limit; i2++) {
    var j = i2;
    var so = i2 * j;
    b[so] += i2;
    steps.push({type:"step", boxes: b.slice(), i:i2, j:j, so:so, add:i2, target: so,
      msg: "i = " + i2 + ", j = " + j + " (bằng i) → ô số " + so + " chỉ có một ước mới là " + i2 + " → cộng thêm " + i2 + "."});
    j = i2 + 1;
    while (j * i2 <= R) {
      so = j * i2;
      var add = i2 + j;
      b[so] += add;
      steps.push({type:"step", boxes: b.slice(), i:i2, j:j, so:so, add:add, target: so,
        msg: "i = " + i2 + ", j = " + j + " → " + i2 + " × " + j + " = " + so + " → ô số " + so + " có 2 ước mới là " + i2 + " và " + j + " → cộng thêm " + i2 + " + " + j + " = " + add + "."});
      j++;
    }
  }
  steps.push({type:"done", boxes: b.slice(), msg: "Xong! Mỗi hộp bây giờ chứa đúng tổng các ước (trừ chính nó). Ô nào có giá trị lớn hơn số ghi trên hộp thì đó là số phong phú."});

  var cur = 0;
  var timer = null;

  var grid = document.getElementById("grid");
  var explain = document.getElementById("explain");
  var stepCounter = document.getElementById("stepCounter");

  function cellColor(idx, s) {
    if (idx === 0) return null;
    if (s.type === "step" && idx === s.target) return "c-amber";
    if (s.type === "done" && s.boxes[idx] > idx) return "c-teal";
    if (s.type === "step" && (idx === s.i || idx === s.j)) return "c-blue";
    return null;
  }

  function render() {
    var s = steps[cur];
    grid.innerHTML = "";
    for (var idx = 1; idx <= R; idx++) {
      var cls = cellColor(idx, s);
      var wrap = document.createElement("div");
      wrap.className = cls ? cls : "";
      wrap.style.border = "0.5px solid var(--border)";
      wrap.style.borderRadius = "8px";
      wrap.style.padding = "8px 4px";
      wrap.style.textAlign = "center";
      if (!cls) { wrap.style.background = "var(--surface-1)"; }

      var numEl = document.createElement("div");
      numEl.textContent = idx;
      numEl.style.fontSize = "12px";
      numEl.style.color = cls ? "" : "var(--text-muted)";
      numEl.className = cls ? "ts" : "";

      var valEl = document.createElement("div");
      valEl.textContent = s.boxes[idx];
      valEl.style.fontSize = "16px";
      valEl.style.fontWeight = "500";
      valEl.className = cls ? "t" : "";
      if (!cls) { valEl.style.color = "var(--text-primary)"; }

      wrap.appendChild(numEl);
      wrap.appendChild(valEl);
      grid.appendChild(wrap);
    }
    explain.textContent = s.msg;
    stepCounter.textContent = "Bước " + cur + " / " + (steps.length - 1);
    document.getElementById("btnPrev").disabled = (cur === 0);
    document.getElementById("btnNext").disabled = (cur === steps.length - 1);
  }

  document.getElementById("btnNext").onclick = function(){
    if (cur < steps.length - 1) { cur++; render(); }
  };
  document.getElementById("btnPrev").onclick = function(){
    if (cur > 0) { cur--; render(); }
  };
  document.getElementById("btnReset").onclick = function(){
    cur = 0; render();
    if (timer) { clearInterval(timer); timer = null; document.getElementById("btnPlay").textContent = "▶ Tự chạy"; }
  };
  document.getElementById("btnPlay").onclick = function(){
    var btn = document.getElementById("btnPlay");
    if (timer) {
      clearInterval(timer); timer = null; btn.textContent = "▶ Tự chạy";
    } else {
      btn.textContent = "⏸ Dừng";
      timer = setInterval(function(){
        if (cur < steps.length - 1) { cur++; render(); }
        else { clearInterval(timer); timer = null; btn.textContent = "▶ Tự chạy"; }
      }, 1200);
    }
  };

  render();
})();
</script>
