<div>
<h2 class="sr-only">Minh họa từng bước thuật toán quy hoạch động O(N bình phương) cho bài GIFT, với ví dụ N=5, K=2, mảng 4,5,6,4,8</h2>

<div style="display:flex; gap:8px; align-items:center; margin-bottom:1rem; flex-wrap:wrap;">
  <button id="btnPrev">⟵ Lùi</button>
  <button id="btnNext">Tiến ⟶</button>
  <button id="btnPlay">▶ Tự chạy</button>
  <button id="btnReset">↺ Bắt đầu lại</button>
  <span style="margin-left:auto; font-size:13px; color:var(--text-secondary);" id="stepCounter">Bước 0 / 0</span>
</div>

<p style="font-size:12px; color:var(--text-muted); margin:0 0 4px;">Mảng a[] (giá trị phần quà), K = 2</p>
<div id="gridA" style="display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; margin-bottom:1rem;"></div>

<p style="font-size:12px; color:var(--text-muted); margin:0 0 4px;">Mảng f[] (độ dài dãy dài nhất kết thúc tại i)</p>
<div id="gridF" style="display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; margin-bottom:1rem;"></div>

<div style="background:var(--surface-1); border-radius:var(--radius); padding:12px 16px; min-height:56px; display:flex; align-items:center;">
  <p id="explain" style="margin:0; font-size:15px; line-height:1.6;">Nhấn "Tiến" để bắt đầu.</p>
</div>
</div>

<script>
(function(){
  var a = [0, 4, 5, 6, 4, 8];
  var n = 5;
  var k = 2;

  var f = [0, 1, 1, 1, 1, 1];

  var steps = [];
  steps.push({i:null, j:null, f: f.slice(), msg:
    "Khởi tạo f[i] = 1 cho mọi i, vì mỗi phần tử tự đứng một mình luôn tạo thành dãy hợp lệ độ dài 1."});

  for (var i = 1; i <= n; i++) {
    if (i === 1) {
      steps.push({i:i, j:null, f: f.slice(), msg:
        "Xét i = 1 (a[1] = " + a[1] + "): không có j < 1 nào để so sánh, f[1] giữ nguyên = 1."});
    } else {
      steps.push({i:i, j:null, f: f.slice(), msg:
        "Xét i = " + i + " (a[" + i + "] = " + a[i] + "): bắt đầu so sánh với từng j từ 1 đến " + (i-1) + "."});
    }

    for (var j = 1; j < i; j++) {
      var dieuKien1 = (a[i] >= a[j] + k);
      if (!dieuKien1) {
        steps.push({i:i, j:j, f: f.slice(), msg:
          "So sánh j = " + j + " (a[" + j + "] = " + a[j] + "): a[" + i + "] = " + a[i] + " ≥ a[" + j + "]+K = " + a[j] + "+" + k + " = " + (a[j]+k) + "? Sai → bỏ qua, không nối được."});
      } else {
        var candidate = f[j] + 1;
        if (candidate > f[i]) {
          f[i] = candidate;
          steps.push({i:i, j:j, f: f.slice(), msg:
            "So sánh j = " + j + " (a[" + j + "] = " + a[j] + "): " + a[i] + " ≥ " + (a[j]+k) + "? Đúng → nối được! f[" + j + "]+1 = " + f[j] + "+1 = " + candidate + " > f[" + i + "] cũ → cập nhật f[" + i + "] = " + candidate + "."});
        } else {
          steps.push({i:i, j:j, f: f.slice(), msg:
            "So sánh j = " + j + " (a[" + j + "] = " + a[j] + "): " + a[i] + " ≥ " + (a[j]+k) + "? Đúng, nối được, nhưng f[" + j + "]+1 = " + candidate + " không lớn hơn f[" + i + "] hiện tại = " + f[i] + " → không cập nhật."});
        }
      }
    }
  }

  var maxVal = 0, maxIdx = -1;
  for (var t = 1; t <= n; t++) {
    if (f[t] > maxVal) { maxVal = f[t]; maxIdx = t; }
  }
  steps.push({i:null, j:null, f: f.slice(), maxIdx: maxIdx, msg:
    "Đã tính xong toàn bộ f[]. Đáp án là giá trị lớn nhất trong f[]: max(f) = " + maxVal + ", đạt tại f[" + maxIdx + "]."});

  var cur = 0;
  var timer = null;

  var gridA = document.getElementById("gridA");
  var gridF = document.getElementById("gridF");
  var explain = document.getElementById("explain");
  var stepCounter = document.getElementById("stepCounter");

  function renderA(s) {
    gridA.innerHTML = "";
    for (var idx = 1; idx <= n; idx++) {
      var cls = "";
      if (s.i === idx) { cls = "c-blue t"; }
      else if (s.j === idx) { cls = "c-amber t"; }

      var wrap = document.createElement("div");
      wrap.className = cls;
      wrap.style.border = "0.5px solid var(--border)";
      wrap.style.borderRadius = "8px";
      wrap.style.padding = "8px 4px";
      wrap.style.textAlign = "center";
      if (cls === "") { wrap.style.background = "var(--surface-1)"; }

      var lbl = document.createElement("div");
      lbl.textContent = "a[" + idx + "]";
      lbl.style.fontSize = "11px";
      if (cls === "") { lbl.style.color = "var(--text-muted)"; } else { lbl.className = "ts"; }

      var val = document.createElement("div");
      val.textContent = a[idx];
      val.style.fontSize = "16px";
      val.style.fontWeight = "500";
      if (cls === "") { val.style.color = "var(--text-primary)"; }

      wrap.appendChild(lbl);
      wrap.appendChild(val);
      gridA.appendChild(wrap);
    }
  }

  function renderF(s) {
    gridF.innerHTML = "";
    for (var idx = 1; idx <= n; idx++) {
      var cls = "";
      if (s.maxIdx && s.maxIdx === idx) { cls = "c-teal t"; }
      else if (s.i === idx) { cls = "c-blue t"; }

      var wrap = document.createElement("div");
      wrap.className = cls;
      wrap.style.border = "0.5px solid var(--border)";
      wrap.style.borderRadius = "8px";
      wrap.style.padding = "8px 4px";
      wrap.style.textAlign = "center";
      if (cls === "") { wrap.style.background = "var(--surface-1)"; }

      var lbl = document.createElement("div");
      lbl.textContent = "f[" + idx + "]";
      lbl.style.fontSize = "11px";
      if (cls === "") { lbl.style.color = "var(--text-muted)"; } else { lbl.className = "ts"; }

      var val = document.createElement("div");
      val.textContent = s.f[idx];
      val.style.fontSize = "16px";
      val.style.fontWeight = "500";
      if (cls === "") { val.style.color = "var(--text-primary)"; }

      wrap.appendChild(lbl);
      wrap.appendChild(val);
      gridF.appendChild(wrap);
    }
  }

  function render() {
    var s = steps[cur];
    renderA(s);
    renderF(s);
    explain.textContent = s.msg;
    stepCounter.textContent = "Bước " + cur + " / " + (steps.length - 1);
    document.getElementById("btnPrev").disabled = (cur === 0);
    document.getElementById("btnNext").disabled = (cur === steps.length - 1);
  }

  document.getElementById("btnNext").onclick = function(){
    if (cur < steps.length - 1) { cur++; render(); }
  };
  document.getElementById("btnPrev").onclick = function(){
    if (cur > 0) { cur--; render(); }
  };
  document.getElementById("btnReset").onclick = function(){
    cur = 0; render();
    if (timer) { clearInterval(timer); timer = null; document.getElementById("btnPlay").textContent = "▶ Tự chạy"; }
  };
  document.getElementById("btnPlay").onclick = function(){
    var btn = document.getElementById("btnPlay");
    if (timer) {
      clearInterval(timer); timer = null; btn.textContent = "▶ Tự chạy";
    } else {
      btn.textContent = "⏸ Dừng";
      timer = setInterval(function(){
        if (cur < steps.length - 1) { cur++; render(); }
        else { clearInterval(timer); timer = null; btn.textContent = "▶ Tự chạy"; }
      }, 1200);
    }
  };

  render();
})();
</script>
